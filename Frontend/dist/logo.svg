<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="col1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="col2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="col3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284C7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base rounded container -->
  <rect width="48" height="48" rx="12" fill="url(#bgGrad)"/>
  <rect width="48" height="48" rx="12" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Column 1 (To Do / Backlog) -->
  <rect x="8" y="10" width="8" height="28" rx="4" fill="url(#col1Grad)" filter="url(#glow)"/>
  <rect x="10" y="13" width="4" height="6" rx="2" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="10" y="21" width="4" height="10" rx="2" fill="#FFFFFF" fill-opacity="0.5"/>

  <!-- Column 2 (In Progress - taller, active) -->
  <rect x="20" y="8" width="8" height="32" rx="4" fill="url(#col2Grad)"/>
  <rect x="22" y="11" width="4" height="10" rx="2" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="22" y="23" width="4" height="6" rx="2" fill="#FFFFFF" fill-opacity="0.6"/>
  <rect x="22" y="31" width="4" height="5" rx="2" fill="#FFFFFF" fill-opacity="0.4"/>

  <!-- Column 3 (Done - verified) -->
  <rect x="32" y="14" width="8" height="24" rx="4" fill="url(#col3Grad)"/>
  <rect x="34" y="17" width="4" height="8" rx="2" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="34" y="27" width="4" height="7" rx="2" fill="#FFFFFF" fill-opacity="0.5"/>

  <!-- Dynamic collaboration bridge dot -->
  <circle cx="24" cy="4" r="2" fill="#38BDF8"/>
